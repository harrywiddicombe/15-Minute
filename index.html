<script>
    // 1. Your specific Cesium Ion Token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwZjE3MWQwMy1iNDFlLTQxNjUtYTRlMS01N2M1MTQzMWUzODgiLCJpZCI6NDI3NzUxLCJzdWIiOiJoYXJyeXdpZGRpY29tYmUiLCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoiMTUtTWludXRlIiwiaWF0IjoxNzc4NDg0NDIwfQ.nkJq_-tSzrMCbWVGGpxu9PavFzTTAIicpjr3J1Wh8Mw';

    // 2. Initialize Viewer 
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(), 
      animation: false,
      timeline: false,
      baseLayerPicker: false
    });

    // 3. Add Google Photorealistic 3D Tiles
    Cesium.Cesium3DTileset.fromIonAssetId(2275207).then(function(tileset) {
        viewer.scene.primitives.add(tileset);
    }).catch(function(error) {
        console.error(`Error loading tileset: ${error}`);
    });

    // 4. Load Custom GeoJSON Data (Force basic red styling immediately)
    let testDataSource;
    
    const testPromise = Cesium.GeoJsonDataSource.load('https://raw.githubusercontent.com/harrywiddicombe/15-Minute/main/TESTY.geojson', {
        stroke: Cesium.Color.RED,
        fill: Cesium.Color.RED.withAlpha(0.6),
        strokeWidth: 5,
        clampToGround: true 
    });

    testPromise.then(function(dataSource) {
        viewer.dataSources.add(dataSource);
        testDataSource = dataSource;

        // THE GOD MODE X-RAY TRICK: Target every possible geometry type
        const entities = dataSource.entities.values;
        for (let i = 0; i < entities.length; i++) {
            const entity = entities[i];
            
            // If QGIS exported it as Lines
            if (entity.polyline) {
                entity.polyline.material = Cesium.Color.RED;
                entity.polyline.width = 5;
                entity.polyline.depthFailMaterial = Cesium.Color.RED; // X-Ray
            }
            
            // If QGIS exported it as Polygons/Buffers
            if (entity.polygon) {
                entity.polygon.material = Cesium.Color.RED.withAlpha(0.6);
                entity.polygon.outline = true;
                entity.polygon.outlineColor = Cesium.Color.RED;
                entity.polygon.zIndex = 100; // Force it on top
            }

            // If QGIS exported it as Points/Nodes
            if (entity.point) {
                entity.point.color = Cesium.Color.RED;
                entity.point.pixelSize = 10;
                entity.point.disableDepthTestDistance = Number.POSITIVE_INFINITY; // X-Ray
            }
        }
        
        // Auto-fly to the exact location of the data
        viewer.flyTo(dataSource);
        
    }).catch(function(error) {
        console.error(`Error loading GeoJSON: ${error}`);
    });

    // 5. Checkbox Logic
    document.getElementById('testToggle').addEventListener('change', function(e) {
        if (testDataSource) {
            testDataSource.show = e.target.checked;
        }
    });
  </script>
